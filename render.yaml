services:
  - type: web
    name: yoruba-phonemizer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OMP_NUM_THREADS
        value: '1'
      - key: MKL_NUM_THREADS
        value: '1'
